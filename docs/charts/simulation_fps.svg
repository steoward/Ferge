<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Header & Titles -->
    <text x="60" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Simulation Frame Rate Headroom (FPS - Higher is Better)</text>
    <text x="60" y="54" fill="#8b949e" font-size="12.5">Pure Rust Data-Oriented Subsystems vs C++ Production Baseline</text>

    <!-- Dedicated Legend Row (Independent from Title) -->
    <rect x="60" y="70" width="14" height="14" rx="3" fill="#38bdf8"/>
    <text x="82" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Ferge (Rust)</text>
    <rect x="180" y="70" width="14" height="14" rx="3" fill="#fb923c"/>
    <text x="202" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Subject A (RAGE Original C++)</text>

    <!-- Grid Lines & Ticks -->
    <line x1="60" y1="370.0" x2="850" y2="370.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="374.0" fill="#8b949e" font-size="11" text-anchor="end">0</text>
    <line x1="60" y1="305.0" x2="850" y2="305.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="309.0" fill="#8b949e" font-size="11" text-anchor="end">250</text>
    <line x1="60" y1="240.0" x2="850" y2="240.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="244.0" fill="#8b949e" font-size="11" text-anchor="end">500</text>
    <line x1="60" y1="175.0" x2="850" y2="175.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="179.0" fill="#8b949e" font-size="11" text-anchor="end">750</text>
    <line x1="60" y1="110.0" x2="850" y2="110.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="114.0" fill="#8b949e" font-size="11" text-anchor="end">1000</text>

    <!-- Y-Axis Label -->
    <text x="20" y="240.0" fill="#8b949e" font-size="11" font-weight="500" text-anchor="middle" transform="rotate(-90,20,240.0)">Frames Per Second (FPS)</text>
    <line x1="60" y1="370" x2="850" y2="370" stroke="#30363d" stroke-width="1.5"/>

    <!-- Category 1: ECS Simulation (959 FPS vs 160 FPS - 6.0x) -->
    <rect x="114" y="120.7" width="42" height="249.3" rx="4" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="135" y="113.7" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">959</text>
    <rect x="164" y="328.4" width="42" height="41.6" rx="4" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="185" y="321.4" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">160</text>
    <text x="160" y="394" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">ECS (5k Entities)</text>
    <rect x="134" y="406" width="52" height="20" rx="10" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1"/>
    <text x="160" y="420" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">6.0x</text>

    <!-- Category 2: Vehicle Dynamics (0.26 µs vs 0.95 µs -> 844 FPS vs 230 FPS - 3.6x) -->
    <rect x="314" y="150.6" width="42" height="219.4" rx="4" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="335" y="143.6" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">844 (0.26µs)</text>
    <rect x="364" y="310.2" width="42" height="59.8" rx="4" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="385" y="303.2" fill="#fb923c" font-size="11.5" font-weight="700" text-anchor="middle">230 (0.95µs)</text>
    <text x="360" y="394" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">Vehicles (50 Active)</text>
    <rect x="334" y="406" width="52" height="20" rx="10" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1"/>
    <text x="360" y="420" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">3.6x</text>

    <!-- Category 3: Script Fibers (950 FPS vs 280 FPS - 3.4x) -->
    <rect x="514" y="123.0" width="42" height="247.0" rx="4" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="535" y="116.0" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">950</text>
    <rect x="564" y="297.2" width="42" height="72.8" rx="4" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="585" y="290.2" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">280</text>
    <text x="560" y="394" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">Script Fibers (1k)</text>
    <rect x="534" y="406" width="52" height="20" rx="10" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1"/>
    <text x="560" y="420" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">3.4x</text>

    <!-- Category 4: 3D Software Rasterizer (213 FPS @ 640x480 Phong) -->
    <rect x="704" y="314.6" width="42" height="55.4" rx="4" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="725" y="307.6" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">213 FPS</text>
    <rect x="754" y="348.0" width="42" height="22.0" rx="4" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="775" y="363.0" fill="#fb923c" font-size="10.5" font-weight="600" text-anchor="middle">N/A</text>
    <text x="750" y="394" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">3D Rasterizer (CPU)</text>
    <rect x="719" y="406" width="62" height="20" rx="10" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1"/>
    <text x="750" y="420" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">213 FPS</text>
</svg>