<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
    <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fb923c" flood-opacity="0.8"/>
        </filter>
        <filter id="blueDotGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Header & Titles -->
    <text x="60" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Progressive Mipmap Streaming Latency by Distance LOD</text>
    <text x="60" y="54" fill="#8b949e" font-size="12.5">Time to stream and bind texture mip levels at 120 km/h vehicle speed (Lower is Better)</text>

    <!-- Dedicated Legend Row (Independent from Title) -->
    <rect x="60" y="70" width="14" height="14" rx="3" fill="#fb923c"/>
    <text x="82" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Ferge (Rust)</text>
    <rect x="180" y="70" width="14" height="14" rx="3" fill="#38bdf8"/>
    <text x="202" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Subject A: RAGE Original (C++)</text>

    <!-- Grid Lines & Ticks -->
    <line x1="60" y1="370.0" x2="850" y2="370.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="374.0" fill="#8b949e" font-size="11" text-anchor="end">0.0 ms</text>
    <line x1="60" y1="305.0" x2="850" y2="305.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="309.0" fill="#8b949e" font-size="11" text-anchor="end">5.0 ms</text>
    <line x1="60" y1="240.0" x2="850" y2="240.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="244.0" fill="#8b949e" font-size="11" text-anchor="end">10.0 ms</text>
    <line x1="60" y1="175.0" x2="850" y2="175.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="179.0" fill="#8b949e" font-size="11" text-anchor="end">15.0 ms</text>
    <line x1="60" y1="110.0" x2="850" y2="110.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="114.0" fill="#8b949e" font-size="11" text-anchor="end">20.0 ms</text>

    <!-- Y-Axis Label -->
    <text x="20" y="240.0" fill="#8b949e" font-size="11" font-weight="500" text-anchor="middle" transform="rotate(-90,20,240.0)">Latency (ms - Lower is Better)</text>
    <line x1="60" y1="370" x2="850" y2="370" stroke="#30363d" stroke-width="1.5"/>

    <!-- Ferge Gradient Fill Area -->
    <path d="M 90.0,370 L 90.0,169.3 L 270.0,289.4 L 450.0,342.1 L 630.0,364.2 L 810.0,369.4 L 810.0,370 Z" fill="url(#areaGrad)"/>

    <!-- Subject A: RAGE Baseline Curve Line (Blue dashed) -->
    <path d="M 90.0,125.6 L 270.0,194.5 L 450.0,263.4 L 630.0,311.5 L 810.0,333.6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ferge Async Streamer Curve Line (Orange solid) -->
    <path d="M 90.0,169.3 L 270.0,289.4 L 450.0,342.1 L 630.0,364.2 L 810.0,369.4" fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point 1: Close (<15m) -->
    <!-- RAGE Baseline -->
    <circle cx="90.0" cy="125.6" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" filter="url(#blueDotGlow)"/>
    <text x="90.0" y="113.6" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">18.80 ms</text>
    <!-- Ferge -->
    <circle cx="90.0" cy="169.3" r="6.5" fill="#0d1117" stroke="#fb923c" stroke-width="3" filter="url(#dotGlow)"/>
    <text x="90.0" y="157.3" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">15.44 ms</text>
    <text x="90.0" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Close (Under 15m)</text>
    <text x="90.0" y="412" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">Mip 0 (4K)</text>

    <!-- Point 2: Near (15-40m) -->
    <!-- RAGE Baseline -->
    <circle cx="270.0" cy="194.5" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" filter="url(#blueDotGlow)"/>
    <text x="270.0" y="182.5" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">13.50 ms</text>
    <!-- Ferge -->
    <circle cx="270.0" cy="289.4" r="6.5" fill="#0d1117" stroke="#fb923c" stroke-width="3" filter="url(#dotGlow)"/>
    <text x="270.0" y="277.4" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">6.20 ms</text>
    <text x="270.0" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Near (15-40m)</text>
    <text x="270.0" y="412" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">Mip 1 (2K)</text>

    <!-- Point 3: Mid (40-100m) -->
    <!-- RAGE Baseline -->
    <circle cx="450.0" cy="263.4" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" filter="url(#blueDotGlow)"/>
    <text x="450.0" y="251.4" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">8.20 ms</text>
    <!-- Ferge -->
    <circle cx="450.0" cy="342.1" r="6.5" fill="#0d1117" stroke="#fb923c" stroke-width="3" filter="url(#dotGlow)"/>
    <text x="450.0" y="330.1" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">2.15 ms</text>
    <text x="450.0" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Mid (40-100m)</text>
    <text x="450.0" y="412" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">Mip 2 (1K)</text>

    <!-- Point 4: Far (100-250m) -->
    <!-- RAGE Baseline -->
    <circle cx="630.0" cy="311.5" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" filter="url(#blueDotGlow)"/>
    <text x="630.0" y="299.5" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">4.50 ms</text>
    <!-- Ferge -->
    <circle cx="630.0" cy="364.2" r="6.5" fill="#0d1117" stroke="#fb923c" stroke-width="3" filter="url(#dotGlow)"/>
    <text x="630.0" y="352.2" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">0.45 ms</text>
    <text x="630.0" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Far (100-250m)</text>
    <text x="630.0" y="412" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">Mip 3 (512px)</text>

    <!-- Point 5: Horizon (>250m) -->
    <!-- RAGE Baseline -->
    <circle cx="810.0" cy="333.6" r="4.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5" filter="url(#blueDotGlow)"/>
    <text x="810.0" y="321.6" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">2.80 ms</text>
    <!-- Ferge -->
    <circle cx="810.0" cy="369.4" r="6.5" fill="#0d1117" stroke="#fb923c" stroke-width="3" filter="url(#dotGlow)"/>
    <text x="810.0" y="357.4" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">0.05 ms</text>
    <text x="810.0" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Horizon (Over 250m)</text>
    <text x="810.0" y="412" fill="#8b949e" font-size="10.5" font-weight="500" text-anchor="middle">Mip 4 (Ambient)</text>
</svg>