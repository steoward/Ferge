<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
<defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
<text x="80" y="36" fill="#f0f6fc" font-size="19" font-weight="700">Executable and Active System RAM Footprint (Lower is Better)</text>
<text x="80" y="58" fill="#8b949e" font-size="12.5">Memory overhead comparison between pure modular Rust and monolithic C++</text>
<rect x="475" y="23" width="14" height="14" rx="3" fill="#38bdf8"/>
<text x="495" y="35" fill="#e6edf3" font-size="12.5" font-weight="600">Ferrum (Rust)</text>
<rect x="640" y="23" width="14" height="14" rx="3" fill="#fb923c"/>
<text x="660" y="35" fill="#e6edf3" font-size="12.5" font-weight="600">RAGE (GTA 5 C++)</text>
<line x1="80" y1="370.0" x2="805" y2="370.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="374.0" fill="#8b949e" font-size="11" text-anchor="end">0 MB</text>
<line x1="80" y1="298.8" x2="805" y2="298.8" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="302.8" fill="#8b949e" font-size="11" text-anchor="end">700 MB</text>
<line x1="80" y1="227.5" x2="805" y2="227.5" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="231.5" fill="#8b949e" font-size="11" text-anchor="end">1400 MB</text>
<line x1="80" y1="156.2" x2="805" y2="156.2" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="160.2" fill="#8b949e" font-size="11" text-anchor="end">2100 MB</text>
<line x1="80" y1="85.0" x2="805" y2="85.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
<text x="70" y="89.0" fill="#8b949e" font-size="11" text-anchor="end">2800 MB</text>
<line x1="80" y1="370" x2="805" y2="370" stroke="#30363d" stroke-width="1.5"/>
<rect x="143.6" y="366.0" width="54.0" height="4.0" rx="5" fill="url(#blueGrad)" filter="url(#glow)"/>
<text x="170.6" y="358.0" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">4.2 MB</text>
<text x="170.6" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Ferrum (Base)</text>
<rect x="128.6" y="406" width="84" height="20" rx="10" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="0.8"/>
<text x="170.6" y="420" fill="#58a6ff" font-size="10.5" font-weight="600" text-anchor="middle">Ultra Compact</text>
<rect x="324.9" y="364.1" width="54.0" height="5.9" rx="5" fill="url(#blueGrad)" filter="url(#glow)"/>
<text x="351.9" y="356.1" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">57.9 MB</text>
<text x="351.9" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Ferrum (+1k Textures)</text>
<rect x="309.9" y="406" width="84" height="20" rx="10" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="0.8"/>
<text x="351.9" y="420" fill="#58a6ff" font-size="10.5" font-weight="600" text-anchor="middle">Active VRAM</text>
<rect x="506.1" y="283.5" width="54.0" height="86.5" rx="5" fill="url(#orangeGrad)" filter="url(#glow)"/>
<text x="533.1" y="275.5" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">850.0 MB</text>
<text x="533.1" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">RAGE GTA 5 (Init Base)</text>
<rect x="491.1" y="406" width="84" height="20" rx="10" fill="#bd561d" fill-opacity="0.2" stroke="#f0883e" stroke-width="0.8"/>
<text x="533.1" y="420" fill="#f0883e" font-size="10.5" font-weight="600" text-anchor="middle">Engine Init</text>
<rect x="687.4" y="117.6" width="54.0" height="252.4" rx="5" fill="url(#orangeGrad)" filter="url(#glow)"/>
<text x="714.4" y="109.6" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">2,480.0 MB</text>
<text x="714.4" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">RAGE GTA 5 (In-Game)</text>
<rect x="672.4" y="406" width="84" height="20" rx="10" fill="#bd561d" fill-opacity="0.2" stroke="#f0883e" stroke-width="0.8"/>
<text x="714.4" y="420" fill="#f0883e" font-size="10.5" font-weight="600" text-anchor="middle">Full World</text>
</svg>