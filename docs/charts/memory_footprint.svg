<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Header & Titles -->
    <text x="60" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Executable and Active System RAM Footprint (Lower is Better)</text>
    <text x="60" y="54" fill="#8b949e" font-size="12.5">Memory overhead comparison between pure modular Rust and monolithic C++</text>

    <!-- Dedicated Legend Row (Independent from Title) -->
    <rect x="60" y="70" width="14" height="14" rx="3" fill="#fb923c"/>
    <text x="82" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Ferge (Rust)</text>
    <rect x="180" y="70" width="14" height="14" rx="3" fill="#38bdf8"/>
    <text x="202" y="82" fill="#e6edf3" font-size="12.5" font-weight="600">Subject A: RAGE Original (C++)</text>

    <!-- Grid Lines & Ticks -->
    <line x1="60" y1="370.0" x2="850" y2="370.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="374.0" fill="#8b949e" font-size="11" text-anchor="end">0 MB</text>
    <line x1="60" y1="305.0" x2="850" y2="305.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="309.0" fill="#8b949e" font-size="11" text-anchor="end">700 MB</text>
    <line x1="60" y1="240.0" x2="850" y2="240.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="244.0" fill="#8b949e" font-size="11" text-anchor="end">1400 MB</text>
    <line x1="60" y1="175.0" x2="850" y2="175.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="179.0" fill="#8b949e" font-size="11" text-anchor="end">2100 MB</text>
    <line x1="60" y1="110.0" x2="850" y2="110.0" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="114.0" fill="#8b949e" font-size="11" text-anchor="end">2800 MB</text>

    <line x1="60" y1="370" x2="850" y2="370" stroke="#30363d" stroke-width="1.5"/>

    <!-- Bar 1: Ferge (Base) -->
    <rect x="133" y="366.0" width="54" height="4.0" rx="2" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="160" y="358.0" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">4.2 MB</text>
    <text x="160" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Ferge (Base)</text>
    <rect x="115" y="406" width="90" height="20" rx="10" fill="#bd561d" fill-opacity="0.2" stroke="#f0883e" stroke-width="0.8"/>
    <text x="160" y="420" fill="#f0883e" font-size="10.5" font-weight="600" text-anchor="middle">Ultra Compact</text>

    <!-- Bar 2: Ferge (+1k Textures) -->
    <rect x="333" y="364.0" width="54" height="6.0" rx="3" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="360" y="356.0" fill="#fb923c" font-size="12" font-weight="700" text-anchor="middle">57.9 MB</text>
    <text x="360" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Ferge (+1k Textures)</text>
    <rect x="315" y="406" width="90" height="20" rx="10" fill="#bd561d" fill-opacity="0.2" stroke="#f0883e" stroke-width="0.8"/>
    <text x="360" y="420" fill="#f0883e" font-size="10.5" font-weight="600" text-anchor="middle">Active VRAM</text>

    <!-- Bar 3: Subject A (Init Base) -->
    <rect x="533" y="291.1" width="54" height="78.9" rx="5" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="560" y="283.1" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">850.0 MB</text>
    <text x="560" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Subject A (Init Base)</text>
    <rect x="515" y="406" width="90" height="20" rx="10" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="0.8"/>
    <text x="560" y="420" fill="#58a6ff" font-size="10.5" font-weight="600" text-anchor="middle">Engine Init</text>

    <!-- Bar 4: Subject A (In-Game) -->
    <rect x="723" y="139.7" width="54" height="230.3" rx="5" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="750" y="131.7" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">2,480.0 MB</text>
    <text x="750" y="394" fill="#e6edf3" font-size="11.5" font-weight="600" text-anchor="middle">Subject A (In-Game)</text>
    <rect x="705" y="406" width="90" height="20" rx="10" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="0.8"/>
    <text x="750" y="420" fill="#58a6ff" font-size="10.5" font-weight="600" text-anchor="middle">Full World</text>
</svg>